[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih-rf-analyzer"
version = "0.7.0"
description = "Scientifically defensible signal-input foundation for SIH26147"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
reporting = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5"]
all = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
